<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>linked-realms · local test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        z-index: 1;
        top: 12px;
        left: 12px;
        max-width: 340px;
        padding: 12px;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #555;
        border-radius: 6px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 6px 0;
      }
      button {
        padding: 6px 12px;
      }
      #notice {
        color: #f2c230;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <section id="panel">
      <h1>linked-realms</h1>
      <p>Local test · fake identity</p>
      <p id="identity"></p>
      <p id="gold">Gold unavailable</p>
      <p>
        Mining disabled. New players start with all stats at 1 and empty
        inventory. Stats and inventory are saved on this Land.
      </p>
      <button id="enter">Enter local Land</button>
      <button id="leave" disabled>Leave</button>
      <p id="status" role="status">Ready</p>
      <p>Move with WASD or arrow keys.</p>
      <p id="notice" role="status"></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
